<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  shape-rendering="geometricPrecision"
  text-rendering="geometricPrecision"
>
  <!-- Warm amber rounded square — strong contrast against any tab bg. -->
  <rect x="1.5" y="1.5" width="21" height="21" rx="5" fill="#d4a574" />

  <!-- Bold serif "OS" monogram in cream. Font-family stack falls through
       Georgia (macOS/Windows) → Times New Roman (legacy) → generic serif,
       so direct-SVG favicon loads stay readable across browsers. The
       generated .ico/.png variants are rasterized once via librsvg's font
       resolution, so those tiles render identically everywhere. -->
  <text
    x="12"
    y="17.5"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="13"
    fill="#fffaf0"
  >OS</text>
</svg>
