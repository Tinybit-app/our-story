<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  shape-rendering="geometricPrecision"
>
  <defs>
    <!-- Soft drop shadow so the book separates cleanly from both light and
         dark browser-tab backgrounds. -->
    <filter id="bookshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0.3" stdDeviation="0.4" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Open book — two pages angled inward, suggesting depth. Cream fill +
       warm-grey stroke keep it readable on either tab theme. -->
  <g filter="url(#bookshadow)">
    <path
      d="M2.5 6.5 L12 5.5 L12 19.5 L2.5 18 Z"
      fill="#fffdf8"
      stroke="#a89c8a"
      stroke-width="0.45"
      stroke-linejoin="round"
    />
    <path
      d="M12 5.5 L21.5 6.5 L21.5 18 L12 19.5 Z"
      fill="#fffdf8"
      stroke="#a89c8a"
      stroke-width="0.45"
      stroke-linejoin="round"
    />
  </g>

  <!-- Spine line so the pages read as one open book, not two stacked rects. -->
  <line
    x1="12"
    y1="5.5"
    x2="12"
    y2="19.5"
    stroke="#a89c8a"
    stroke-width="0.5"
    stroke-linecap="round"
  />

  <!-- Bookmark ribbon. Sticks up above the top edge of the right page,
       ends in a classic V notch. The single bold accent against the
       cream pages makes the mark identifiable at 16px. -->
  <path
    d="M14 2.5 L17 2.5 L17 10 L15.5 8.3 L14 10 Z"
    fill="#d64040"
    stroke="#9c2a2a"
    stroke-width="0.35"
    stroke-linejoin="round"
  />
</svg>
