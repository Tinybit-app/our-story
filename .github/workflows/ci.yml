name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase env vars
        run: |
          supabase status -o env >> $GITHUB_ENV
          # @nuxtjs/supabase reads SUPABASE_KEY; CLI outputs SUPABASE_ANON_KEY — bridge them
          echo "SUPABASE_KEY=$(supabase status | grep 'anon key' | awk '{print $NF}')" >> $GITHUB_ENV
          # Dummy secrets so Nuxt starts without crashing (not used in E2E tests)
          echo "JWT_SECRET=ci-placeholder-secret-not-used-in-tests" >> $GITHUB_ENV

      - name: Run DB tests (RLS policies)
        run: |
          if find supabase/tests -name "*.sql" 2>/dev/null | grep -q .; then
            pnpm db:test
          else
            echo "No DB tests found, skipping."
          fi

      - name: Run unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e


      - name: Stop Supabase
        run: supabase stop
