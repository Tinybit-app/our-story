name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Security audit
        run: pnpm audit --audit-level high

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase env vars
        run: |
          STATUS_ENV=$(supabase status --output env 2>&1)
          echo "=== supabase status output ===" && echo "$STATUS_ENV" && echo "==="
          # Anchor greps with ^ to avoid partial matches; try both CLI v1 and v2 key names
          ANON_KEY=$(echo "$STATUS_ENV" | grep -E '^PUBLISHABLE_KEY=|^ANON_KEY=' | head -1 | cut -d= -f2-)
          SERVICE_KEY=$(echo "$STATUS_ENV" | grep -E '^SECRET_KEY=|^SERVICE_ROLE_KEY=' | head -1 | cut -d= -f2-)
          if [ -z "$SERVICE_KEY" ]; then
            echo "ERROR: SERVICE_KEY is empty — check supabase status output above" >&2
            exit 1
          fi
          # URL is always fixed for local Supabase
          echo "NUXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "NUXT_PUBLIC_SUPABASE_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "NUXT_SUPABASE_SECRET_KEY=$SERVICE_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV
          echo "JWT_SECRET=ci-placeholder-secret-not-used-in-tests" >> $GITHUB_ENV
          echo "ANON_KEY starts: ${ANON_KEY:0:20}"
          echo "SERVICE_KEY starts: ${SERVICE_KEY:0:20}"

      - name: Run DB tests (RLS policies)
        run: |
          if find supabase/tests -name "*.sql" 2>/dev/null | grep -q .; then
            pnpm db:test
          else
            echo "No DB tests found, skipping."
          fi

      - name: Run unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Stop Supabase
        run: supabase stop
