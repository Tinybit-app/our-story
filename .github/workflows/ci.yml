name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase env vars
        run: |
          # Capture structured output and echo it for debugging
          STATUS_ENV=$(supabase status --output env 2>&1)
          echo "=== supabase status --output env ==="
          echo "$STATUS_ENV"
          echo "==="
          # Extract values and export with the NUXT_ names the app expects
          SUPABASE_URL=$(echo "$STATUS_ENV" | grep '^SUPABASE_URL=' | cut -d= -f2-)
          SUPABASE_ANON_KEY=$(echo "$STATUS_ENV" | grep '^SUPABASE_ANON_KEY=' | cut -d= -f2-)
          SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS_ENV" | grep '^SUPABASE_SERVICE_ROLE_KEY=' | cut -d= -f2-)
          echo "NUXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" >> $GITHUB_ENV
          echo "NUXT_PUBLIC_SUPABASE_KEY=$SUPABASE_ANON_KEY" >> $GITHUB_ENV
          echo "NUXT_SUPABASE_SECRET_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> $GITHUB_ENV
          echo "JWT_SECRET=ci-placeholder-secret-not-used-in-tests" >> $GITHUB_ENV
          echo "Exported: NUXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
          echo "Exported: NUXT_PUBLIC_SUPABASE_KEY starts: ${SUPABASE_ANON_KEY:0:20}"

      - name: Run DB tests (RLS policies)
        run: |
          if find supabase/tests -name "*.sql" 2>/dev/null | grep -q .; then
            pnpm db:test
          else
            echo "No DB tests found, skipping."
          fi

      - name: Run unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Stop Supabase
        run: supabase stop
