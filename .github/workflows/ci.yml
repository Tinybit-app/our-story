name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase env vars
        run: |
          # Parse supabase status output explicitly
          SUPABASE_URL=$(supabase status 2>/dev/null | grep 'API URL' | awk '{print $NF}')
          SUPABASE_KEY=$(supabase status 2>/dev/null | grep 'anon key' | awk '{print $NF}')
          SUPABASE_SERVICE_ROLE_KEY=$(supabase status 2>/dev/null | grep 'service_role key' | awk '{print $NF}')
          echo "SUPABASE_URL=$SUPABASE_URL" >> $GITHUB_ENV
          echo "SUPABASE_KEY=$SUPABASE_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> $GITHUB_ENV
          echo "JWT_SECRET=ci-placeholder-secret-not-used-in-tests" >> $GITHUB_ENV
          # Debug: confirm values are populated
          echo "SUPABASE_URL=$SUPABASE_URL"
          echo "SUPABASE_KEY starts with: ${SUPABASE_KEY:0:20}"

      - name: Run DB tests (RLS policies)
        run: |
          if find supabase/tests -name "*.sql" 2>/dev/null | grep -q .; then
            pnpm db:test
          else
            echo "No DB tests found, skipping."
          fi

      - name: Run unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Stop Supabase
        run: supabase stop
