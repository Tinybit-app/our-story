name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Security audit
        run: pnpm audit --audit-level high

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase env vars
        run: |
          STATUS=$(supabase status 2>&1)
          STATUS_ENV=$(supabase status --output env 2>&1)
          echo "=== supabase status ==="        && echo "$STATUS"     && echo "==="
          echo "=== supabase status --output env ===" && echo "$STATUS_ENV" && echo "==="

          # Try every known format across CLI versions, then fall back to JWT regex
          ANON_KEY=$(echo "$STATUS"     | grep -i 'anon key:'                 | awk '{print $NF}')
          # Prefer ANON_KEY (JWT) over PUBLISHABLE_KEY (new non-JWT format); strip surrounding quotes from --output env format
          [ -z "$ANON_KEY" ] && ANON_KEY=$(echo "$STATUS_ENV" | grep '^ANON_KEY=' | head -1 | cut -d= -f2- | tr -d '"')
          [ -z "$ANON_KEY" ] && ANON_KEY=$(echo "$STATUS_ENV" | grep '^PUBLISHABLE_KEY=' | head -1 | cut -d= -f2- | tr -d '"')

          SERVICE_KEY=$(echo "$STATUS"     | grep -i 'service_role key:'          | awk '{print $NF}')
          # Prefer SERVICE_ROLE_KEY (JWT) over SECRET_KEY (new non-JWT sb_secret_... format); strip surrounding quotes from --output env format
          [ -z "$SERVICE_KEY" ] && SERVICE_KEY=$(echo "$STATUS_ENV" | grep '^SERVICE_ROLE_KEY=' | head -1 | cut -d= -f2- | tr -d '"')
          # Last resort: extract the second JWT token from the full output (anon is first, service role is second)
          [ -z "$SERVICE_KEY" ] && SERVICE_KEY=$(echo "$STATUS$STATUS_ENV" | grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' | sed -n '2p')

          if [ -z "$SERVICE_KEY" ]; then
            echo "ERROR: SERVICE_KEY is empty — check supabase status output above" >&2
            exit 1
          fi
          echo "NUXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "NUXT_PUBLIC_SUPABASE_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "NUXT_SUPABASE_SECRET_KEY=$SERVICE_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV
          echo "JWT_SECRET=ci-placeholder-secret-not-used-in-tests" >> $GITHUB_ENV
          echo "ANON_KEY starts:    ${ANON_KEY:0:20}"
          echo "SERVICE_KEY starts: ${SERVICE_KEY:0:20}"

      - name: Run DB tests (RLS policies)
        run: |
          if find supabase/tests -name "*.sql" 2>/dev/null | grep -q .; then
            pnpm db:test
          else
            echo "No DB tests found, skipping."
          fi

      - name: Run unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Build for Lighthouse
        run: pnpm build
        env:
          VAPID_PUBLIC_KEY: placeholder
          VAPID_PRIVATE_KEY: placeholder
          VAPID_SUBJECT: mailto:ci@example.com

      - name: Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Stop Supabase
        run: supabase stop
